<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b61">
    <meta name="description" content="Sign in to your private chats.">
    <title>Sign in | Murmur</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
    <script src="./auth.js" defer></script>
  </head>
  <body class="auth-page" data-page="login">
    <main class="auth-shell">
      <a class="brand auth-brand" href="./login.html" aria-label="Murmur sign in">
        <img class="brand-logo" src="./icons/icon.svg" alt="">
        <span>Murmur</span>
      </a>
      <section class="auth-page-card" aria-labelledby="auth-title">
        <p class="eyebrow">Welcome back</p>
        <h1 id="auth-title">Sign in to your chats.</h1>
        <p class="auth-page-copy">Your conversations are waiting for you.</p>
        <form class="auth-form auth-form-single" id="auth-form">
          <label for="auth-username">Username</label>
          <input id="auth-username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" maxlength="1024" autocomplete="current-password" required>
          <button class="button button-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-status" id="auth-status" role="status" aria-live="polite">Checking your account…</p>
        <p class="auth-page-switch">New here? <a href="./register.html">Create an account</a></p>
      </section>
      <p class="auth-page-footnote">Private conversations, on every device.</p>
    </main>
  </body>
</html>
